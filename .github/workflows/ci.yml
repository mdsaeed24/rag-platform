name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.6'
      - run: python -m deploy.repository_check

  backend:
    needs: source-review
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.6'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact native dependency lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements.lock
          .venv/bin/python -m pip check
      - name: Cache public embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Provision public embedding model before offline tests
        run: .venv/bin/python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer("all-MiniLM-L6-v2", trust_remote_code=False)'
      - name: Backend tests and isolated smoke checks
        run: .venv/bin/python -m deploy.ci backend
      - name: Build allowlisted release
        run: .venv/bin/python -m deploy.package

  interface:
    needs: source-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: ui/requirements.txt
      - name: Install interface dependencies
        run: |
          python -m venv .venv-ui
          .venv-ui/bin/python -m pip install --only-binary=:all: -r ui/requirements.txt
          .venv-ui/bin/python -m pip check
      - name: Interface tests
        run: .venv-ui/bin/python -m deploy.ci ui

  linux-container:
    needs: source-review
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Linux image and run offline backend regression checks
        run: docker build --target validation -t rag-validation .
      - name: Build runtime image
        run: docker build --target runtime -t rag-runtime .
      - name: Check startup, readiness, login and abstention within free-tier memory
        run: |
          docker run --detach --name rag-probe --network none --memory 512m --memory-swap 512m --cpus 1 \
            -e DEEPSEEK_API_KEY=offline-ci-no-provider-access \
            -e JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))') rag-runtime
          docker exec rag-probe python -m deploy.container_probe
      - name: Show sanitized container diagnostics and clean up
        if: always()
        run: |
          docker inspect rag-probe --format '{{json .State}}' || true
          docker logs rag-probe || true
          docker rm --force rag-probe || true
